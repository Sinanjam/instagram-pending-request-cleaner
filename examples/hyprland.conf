# Hyprland 0.57 structured window rule example.
# Change workspace 9 to any workspace you prefer.
windowrule {
  name = ig-request-cleaner-firefox-workspace
  match:class = ^ig-request-cleaner-firefox$
  workspace = 9 silent
  no_initial_focus = true
  focus_on_activate = false
  render_unfocused = true
}

# Do not use a broad class=firefox rule: it would affect personal Firefox windows.
